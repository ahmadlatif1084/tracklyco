name: 🚀 Deploy Tracklyco to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout Code ----------
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      # ---------- Setup Node.js ----------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- Deploy via SSH ----------
      - name: 🚀 Deploy to OnicHost via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.ONICHOST_HOST }}
          username: ${{ secrets.ONICHOST_USER }}
          key: ${{ secrets.ONICHOST_SSH_KEY }}
          passphrase: ${{ secrets.ONICHOST_SSH_PASSPHRASE }}
          port: ${{ secrets.ONICHOST_PORT }}
          script: |
            # Deployment folders
            DEPLOY_DIR=/home/tracklyc/deploy
            BACKEND_DIR=$DEPLOY_DIR/backend
            FRONTEND_DIR=$DEPLOY_DIR/frontend
            PUBLIC_HTML=/home/tracklyc/public_html

            echo "🔹 Create deployment folder if it doesn't exist"
            mkdir -p $DEPLOY_DIR

            # ---------- Clone repo if missing ----------
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "🔹 Cloning repo..."
              git clone -b main git@github.com:ahmadlatif1084/tracklyco.git $DEPLOY_DIR
            fi

            cd $DEPLOY_DIR
            echo "🔹 Pull latest code..."
            git reset --hard
            git pull origin main

            # ---------- Backend ----------
            echo "🔹 Installing backend dependencies..."
            cd $BACKEND_DIR
            npm install --legacy-peer-deps
            echo "🔹 Building backend..."
            npm run build
            echo "🔹 Backend ready. Ensure Node.js app in cPanel points to dist/main.js"

            # ---------- Frontend ----------
            echo "🔹 Installing frontend dependencies..."
            cd $FRONTEND_DIR
            npm install --legacy-peer-deps
            echo "🔹 Building frontend..."
            npm run build

            # ---------- Clean public_html ----------
            echo "🔹 Cleaning public_html..."
            rm -rf $PUBLIC_HTML/*

            echo "🔹 Copying new frontend build to public_html..."
            cp -r dist/* $PUBLIC_HTML/

            echo "✅ Deployment completed successfully!"
