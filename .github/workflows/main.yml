name: 🚀 Deploy Tracklyco to cPanel

on:
  push:
    branches:
      - main  # or master if you use master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      # ---------- FRONTEND BUILD ----------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install and build frontend
        working-directory: ./frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      # ---------- BACKEND INSTALL ----------
      - name: 📦 Install backend dependencies
        working-directory: ./backend
        run: |
          npm install --legacy-peer-deps
          npm run build

      # ---------- DEPLOY FRONTEND ----------
      - name: 🚀 Deploy frontend (Vue) to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.tracklyco.com
          username: developer@tracklyco.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./frontend/dist/
          server-dir: /public_html/
          state-name: .ftp-deploy-frontend-state.json

      # ---------- DEPLOY BACKEND ----------
      - name: 🚀 Deploy backend (NestJS) to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.tracklyco.com
          username: developer@tracklyco.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: ./backend/
          server-dir: /public_html/backend/
          exclude: |
            **/node_modules/**
            **/.git/**
            **/.github/**
            **/.env
          state-name: .ftp-deploy-backend-state.json
