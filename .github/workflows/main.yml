name: 🚀 Deploy Tracklyco to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout Code ----------
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      # ---------- Setup Node.js ----------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- Deploy via SSH ----------
      - name: 🚀 Deploy to OnicHost via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.ONICHOST_HOST }}
          username: ${{ secrets.ONICHOST_USER }}
          key: ${{ secrets.ONICHOST_SSH_KEY }}
          passphrase: ${{ secrets.ONICHOST_SSH_PASSPHRASE }}
          port: ${{ secrets.ONICHOST_PORT }}
          script: |
            # === Define Directories ===
            DEPLOY_DIR=/home/tracklyc/deploy
            BACKEND_DIR=$DEPLOY_DIR/backend
            FRONTEND_DIR=$DEPLOY_DIR/frontend
            PUBLIC_HTML=/home/tracklyc/public_html

            echo "🔹 Preparing deployment folder..."
            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "🔹 Existing repo found. Pulling latest changes..."
              cd $DEPLOY_DIR
              git fetch origin main
              git reset --hard origin/main
            else
              echo "🔹 No existing repo found. Cloning fresh..."
              rm -rf $DEPLOY_DIR
              git clone -b main https://x-access-token:${GITHUB_TOKEN}@github.com/ahmadlatif1084/tracklyco.git $DEPLOY_DIR
            fi

            # ---------- Backend ----------
            if [ -d "$BACKEND_DIR" ]; then
              echo "🔹 Installing backend dependencies..."
              cd $BACKEND_DIR
              npm install --legacy-peer-deps

              echo "🔹 Building backend..."
              npm run build
              echo "✅ Backend built successfully."
              echo "➡️ Ensure your cPanel Node.js app points to:"
              echo "   $BACKEND_DIR/dist/main.js"
            else
              echo "⚠️ Backend directory not found!"
            fi

            # ---------- Frontend ----------
            if [ -d "$FRONTEND_DIR" ]; then
              echo "🔹 Installing frontend dependencies..."
              cd $FRONTEND_DIR
              npm install --legacy-peer-deps

              echo "🔹 Building frontend..."
              npm run build
              echo "✅ Frontend built successfully."

              echo "🔹 Cleaning public_html..."
              rm -rf $PUBLIC_HTML/*

              echo "🔹 Copying frontend build to public_html..."
              cp -r dist/* $PUBLIC_HTML/
              echo "✅ Frontend deployed successfully."
            else
              echo "⚠️ Frontend directory not found!"
            fi

            echo "🎉 Deployment completed successfully!"
