name: 🚀 Deploy Tracklyco to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout Code ----------
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      # ---------- Setup Node.js ----------
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- DEPLOY VIA SSH ----------
      - name: 🚀 Deploy to OnicHost via SSH
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.ONICHOST_HOST }}
          username: ${{ secrets.ONICHOST_USER }}
          key: ${{ secrets.ONICHOST_SSH_KEY }}
          passphrase: ${{ secrets.ONICHOST_SSH_PASSPHRASE }}
          port: ${{ secrets.ONICHOST_PORT }}
          script: |
            echo "🔹 Navigate to deployment folder"
            cd ${{ secrets.DEPLOY_PATH }}

            echo "🔹 Pull latest code"
            git reset --hard
            git pull origin main

            # ---------- Backend ----------
            echo "🔹 Install backend dependencies"
            cd backend
            npm install --legacy-peer-deps
            npm run build

            echo "🔹 Start backend with PM2"
            pm2 restart tracklyco-backend || pm2 start dist/main.js --name tracklyco-backend

            # ---------- Frontend ----------
            echo "🔹 Install frontend dependencies"
            cd ../frontend
            npm install --legacy-peer-deps
            npm run build

            echo "🔹 Copy frontend build to public_html"
            cp -r dist/* ../

            echo "✅ Deployment complete!"
